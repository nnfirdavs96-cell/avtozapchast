<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Прайс и заказ</title></head>
<body>
<h2>Прайс-лист</h2>
<table border="1" cellpadding="6">
  <caption>Прайс-лист на тормозную систему, март 2026</caption>
  <thead><tr><th>Товар</th><th>Артикул</th><th>Цена</th></tr></thead>
  <tbody>
    <tr><td>Колодки Bosch</td><td>0986424815</td><td>250 сомони</td></tr>
    <tr><td>Фильтр Mann</td><td>W71280</td><td>45 сомони</td></tr>
    <tr><td>Диски Brembo</td><td>09.9468.11</td><td>780 сомони</td></tr>
  </tbody>
</table>

<h2>Оформление заказа</h2>
<form action="/order.php" method="POST">
  <input type="hidden" name="tovar_id" value="42">
  <p><label for="name">Ваше имя</label><br><input type="text" id="name" name="name" required minlength="2"></p>
  <p><label for="phone">Телефон</label><br><input type="tel" id="phone" name="phone" required placeholder="+992 __ ___ __ __"></p>
  <p><label for="qty">Количество</label><br><input type="number" id="qty" name="qty" value="1" min="1" max="20"></p>
  <p><label for="brand">Предпочитаемый бренд</label><br>
    <select id="brand" name="brand"><option value="">Любой</option><option value="bosch">Bosch</option><option value="mann">Mann</option></select></p>
  <fieldset><legend>Способ получения</legend>
    <input type="radio" id="d1" name="dostavka" value="samovyvoz" checked><label for="d1">Самовывоз, Худжанд</label><br>
    <input type="radio" id="d2" name="dostavka" value="kurier"><label for="d2">Доставка курьером</label>
  </fieldset>
  <p><label for="comment">Комментарий</label><br><textarea id="comment" name="comment" rows="3" placeholder="Марка, год, объём двигателя"></textarea></p>
  <p><input type="checkbox" id="soglasie" name="soglasie" required><label for="soglasie">Согласен на обработку данных</label></p>
  <button type="submit">Оформить заказ</button>
</form>
</body></html>
