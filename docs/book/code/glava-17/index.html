<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Живой поиск и корзина</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <div>
            <div class="logo">Автозапчасти Firdavs</div>
            <div class="slogan">Живой поиск без перезагрузки страницы</div>
        </div>
        <div class="korzina">
            Корзина: <span class="korzina-shtuk">0</span> шт. ·
            <span class="korzina-summa">0</span> сомони
        </div>
    </header>

    <main>
        <form class="filtry">
            <div class="ryad">
                <div>
                    <label for="poisk">Поиск по названию</label>
                    <input type="search" id="poisk" placeholder="например, фильтр">
                </div>
                <div>
                    <label for="brend">Бренд</label>
                    <select id="brend">
                        <option value="">Все бренды</option>
                        <option value="Bosch">Bosch</option>
                        <option value="Mann">Mann</option>
                        <option value="Denso">Denso</option>
                        <option value="Brembo">Brembo</option>
                    </select>
                </div>
                <div class="galka">
                    <input type="checkbox" id="v-nalichii">
                    <label for="v-nalichii">Только в наличии</label>
                </div>
            </div>
        </form>

        <p class="schetchik"></p>
        <div class="katalog"></div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
